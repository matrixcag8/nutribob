name: Grillo
options:
  bundleIdPrefix: com.roberto
  deploymentTarget:
    iOS: "26.0"
packages:
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.32.3
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    exactVersion: 1.0.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.5
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: G4KDH2SUPV
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: 1
targets:
  Grillo:
    type: application
    platform: iOS
    sources: [Grillo]
    dependencies:
      - package: mlx-swift-lm
        products: [MLXLLM, MLXLMCommon, MLXHuggingFace]
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Grillo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    scheme:
      testTargets: [GrilloTests]
  GrilloTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GrilloTests]
    dependencies:
      - target: Grillo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
